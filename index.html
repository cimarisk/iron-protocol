<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Workout</title>
<meta name="theme-color" content="#0B0F14">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0B0F14;
  --surface: #161F29;
  --surface-2: #202B37;
  --surface-3: #2D3A49;
  --border: #5E7285;        /* 3.3:1 on the card surface — visible in direct sun */
  --text: #F5F9FD;
  --text-muted: #C9D6E2;    /* 11.2:1 — was 5.8:1 */
  --text-dim: #A2B1C1;      /* 7.6:1  — was 3.1:1 */
  --accent: #63B4FF;
  --accent-soft: #22364E;
  --done: #6EE7B0;
  --warn: #FFC978;
  --danger: #FF8C86;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; min-height: 100vh; overscroll-behavior: none; }
body { padding: max(env(safe-area-inset-top), 12px) 12px max(env(safe-area-inset-bottom), 24px); }
button, input, textarea { font-family: inherit; font-size: 16px; }
input[type="number"], input[type="text"] { background: var(--bg); color: var(--text); border: 2px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 20px; text-align: center; width: 100%; font-variant-numeric: tabular-nums; }
input[type="number"]:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,180,255,0.28); }
button { background: var(--surface-3); color: var(--text); border: 2px solid var(--border); border-radius: 10px; padding: 12px 16px; cursor: pointer; font-weight: 600; min-height: 48px; transition: opacity 0.15s; }
button:active { opacity: 0.7; }
button.primary { background: var(--accent); color: #0B0F14; border-color: var(--accent); font-weight: 600; }
button.ghost { background: var(--surface-2); border-color: var(--border); color: var(--text); }
.app { max-width: 480px; margin: 0 auto; }
.cat-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-bottom: 14px; }
.cat-toggle button { flex: 1; height: 44px; min-height: 44px; padding: 0 12px; background: transparent; border: none; border-radius: 999px; color: var(--text-muted); font-weight: 500; font-size: 14px; }
.cat-toggle button.active { background: var(--surface-3); color: var(--text); }
.cat-toggle .badge { font-size: 11px; color: var(--text-dim); margin-left: 4px; font-weight: 400; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 4px; }
.session-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; cursor: pointer; }
.session-pill .date { color: var(--text); font-weight: 500; }
.session-pill .arrow { color: var(--text-dim); }
.nav-buttons { display: flex; gap: 12px; }
.nav-buttons button { width: 48px; height: 48px; min-height: 48px; padding: 0; font-size: 20px; }
.session-title { font-size: 22px; font-weight: 600; margin: 4px 4px 6px; }
.session-meta { font-size: 13px; color: var(--text-muted); padding: 0 4px; margin-bottom: 14px; line-height: 1.5; }
.warmup-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
.warmup-block .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.warmup-block ul { margin: 0; padding-left: 18px; color: var(--text); font-size: 14px; line-height: 1.65; }
.warmup-block ul li::marker { color: var(--text-dim); }
.ex-card { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.ex-header { padding: 14px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ex-header-left { flex: 1; min-width: 0; }
.ex-num { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.ex-name { font-size: 21px; font-weight: 700; line-height: 1.3; }
.ex-progress { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--border); }
.dot.done { background: var(--done); }
.dot.dev { background: var(--warn); }
.dot.ramp { background: var(--surface-3); opacity: 0.5; }
.dot.ramp.done { background: var(--text-dim); opacity: 1; }
.ex-body { padding: 0 16px 16px; display: none; }
.ex-card.open .ex-body { display: block; }
.ex-meta-row { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--text-muted); margin: 4px 0 12px; }
.ex-meta-row .label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px; }
.ex-meta-row .val { color: var(--text); font-variant-numeric: tabular-nums; }
.cue { width: 100%; line-height: 1.5; margin-top: 6px; font-size: 15px; color: var(--text); font-weight: 500; }
.cue .label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; display: block; margin-bottom: 4px; font-weight: 600; }
.cue ul.bullets { margin: 0; padding-left: 18px; }
.cue ul.bullets li { margin: 2px 0; }
.alt-block { margin-top: 10px; padding: 8px 12px; background: var(--surface-2); border-radius: 8px; border-left: 3px solid var(--warn); font-size: 14px; color: var(--text); }
.alt-block .label { color: var(--warn); text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; font-weight: 700; display: block; margin-bottom: 2px; }
.set-table { border-top: 2px solid var(--border); border-bottom: 2px solid var(--border); margin: 0 -16px 12px; }
.set-row { display: grid; grid-template-columns: 38px 2fr 0.8fr 0.8fr 30px; gap: 8px; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); font-size: 20px; min-height: 66px; font-weight: 600; }
.set-row:last-child { border-bottom: none; }
.set-row.head { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; min-height: 32px; padding: 8px 16px; font-weight: 600; }
.set-row.ramp { background: rgba(255,255,255,0.015); }
.set-row.ramp .set-label, .set-row.ramp .weight-big, .set-row.ramp .set-cell { color: var(--text-muted); }
.set-row.tappable { cursor: pointer; }
.set-row.current { background: #1B2C42; box-shadow: inset 5px 0 0 var(--warn); }
.set-row.current.ramp { background: #182636; box-shadow: inset 5px 0 0 var(--warn); }
.set-row.completed { opacity: 0.78; }
.set-row.completed.deviated { opacity: 0.85; }
.set-label { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 19px; color: var(--text-muted); }
.set-cell { font-variant-numeric: tabular-nums; text-align: left; font-weight: 700; color: var(--text); }
.weight-big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tap-cell { text-align: right; color: var(--text-muted); font-size: 26px; line-height: 1; font-weight: 700; }
.set-row.completed .tap-cell { color: var(--done); }
.confirm-panel { padding: 14px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.confirm-head { font-size: 20px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.45; }
.confirm-head b { font-weight: 700; color: var(--text); font-size: 26px; display: block; margin-top: 2px; }
.confirm-actions { display: flex; flex-direction: column; gap: 8px; }
.btn-done { height: 52px; font-size: 16px; font-weight: 600; }
.confirm-secondary { display: flex; gap: 8px; }
.confirm-secondary button { flex: 1; height: 48px; font-size: 14px; }
.edit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.edit-grid label { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }
/* Stacked so Reps and RIR can never be confused for one another. */
.edit-stack { display: flex; flex-direction: column; gap: 12px; margin: 14px 0 16px; }
.ed-row { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 10px 12px 12px; }
.ed-row.dim { opacity: 0.9; border-style: dashed; }
.ed-label { font-size: 15px; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.ed-label .ed-unit { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: none; letter-spacing: 0; margin-left: 6px; }
.ed-ctl { display: flex; align-items: stretch; gap: 10px; }
.ed-ctl input { flex: 1; min-width: 0; height: 60px; font-size: 30px; font-weight: 800; text-align: center; padding: 0 8px; }
.ed-step { flex: 0 0 68px; height: 60px; min-height: 60px; padding: 0; font-size: 30px; font-weight: 800; line-height: 1;
  background: var(--surface-3); border: 2px solid var(--border); color: var(--text); }
.ed-step:active { background: var(--accent); color: #0B0F14; border-color: var(--accent); }
.rest-panel { background: var(--surface-2); border: 1px solid var(--accent); border-radius: 12px; padding: 18px 16px; text-align: center; margin: 0 -16px 12px; }
.rest-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 600; }
.rest-time { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; margin: 6px 0 4px; color: var(--text); }
.rest-next { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.rest-actions { display: flex; gap: 8px; justify-content: center; }
.rest-actions button { height: 38px; padding: 0 18px; font-size: 13px; min-width: 90px; }

/* ===== Plate math (computed, per side) ===== */
.weight-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
.plate-line { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: .01em; white-space: nowrap; }
.plate-line .ps { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
.plate-delta { font-size: 14px; font-weight: 700; color: var(--warn); white-space: nowrap; }
.plate-big { background: var(--bg); border: 1px solid var(--border); border-left: 5px solid var(--warn); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; }
.plate-big .pb-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); font-weight: 700; margin-bottom: 3px; }
.plate-big .pb-val { font-size: 30px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.15; }
.plate-big .pb-delta { font-size: 17px; font-weight: 700; color: var(--warn); margin-top: 5px; }
.plate-big .pb-note { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* ===== Last-time readback ===== */
.ex-last { font-size: 13px; color: var(--text-muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.ex-last b { color: var(--text); font-weight: 700; }

/* ===== Cut sets ===== */
.set-row.cut { opacity: 0.55; }
.set-row.cut .weight-big, .set-row.cut .set-cell, .set-row.cut .set-label { text-decoration: line-through; text-decoration-color: var(--text-dim); }
.set-row.cut .tap-cell { color: var(--text-dim); text-decoration: none; }
.dot.cut { background: transparent; border: 2px solid var(--text-dim); }
.btn-cut { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn-undo { background: transparent; border-color: var(--warn); color: var(--warn); }

/* ===== Sticky rest dock — stays on screen while you scroll to the next set ===== */
body.resting { padding-bottom: 210px; }
.rest-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--surface-2); border-top: 3px solid var(--accent);
  padding: 10px 14px calc(10px + max(env(safe-area-inset-bottom), 4px)); box-shadow: 0 -8px 24px rgba(0,0,0,0.55); }
.rest-dock-inner { max-width: 480px; margin: 0 auto; }
.rd-top { display: flex; align-items: baseline; gap: 12px; }
.rd-time { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: var(--text-muted); flex: 0 0 auto; }
.rd-time .rd-unit { font-size: 15px; font-weight: 600; }
.rd-body { flex: 1; min-width: 0; }
.rd-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
.rd-next { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.15; font-variant-numeric: tabular-nums; }
.rd-plate { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 3px; font-variant-numeric: tabular-nums; }
.rd-plate .ps { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
.rd-delta { font-size: 15px; font-weight: 700; color: var(--warn); margin-top: 2px; }
.rd-actions { display: flex; gap: 10px; margin-top: 10px; }
.rd-actions button { flex: 1; height: 46px; min-height: 46px; font-size: 15px; }
.work-panel { background: var(--surface-2); border: 2px solid var(--warn); border-radius: 12px; padding: 20px 16px; text-align: center; margin: 0 -16px 12px; }
.work-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); font-weight: 700; }
.work-time { font-size: 72px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; margin: 6px 0 4px; color: var(--text); }
.work-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
.work-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.work-actions button { height: 40px; padding: 0 18px; font-size: 13px; min-width: 90px; }
.work-actions .primary { background: var(--warn); color: #0B0F14; border-color: var(--warn); }
.btn-start { height: 52px; font-size: 16px; font-weight: 600; background: var(--warn); color: #0B0F14; border-color: var(--warn); }
.notes-field { margin: 6px 0 0; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--text); cursor: text; min-height: 52px; line-height: 1.55; outline: none; font-family: inherit; width: 100%; resize: vertical; }
.cardio-swap { margin: 10px 0 0; }
.swap-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.swap-chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 7px 16px; font-size: 13px; color: var(--text); cursor: pointer; font-family: inherit; }
.swap-chip:active { opacity: 0.7; }
.notes-field:focus { border-color: var(--accent); background: var(--surface-3); }
.complete-banner { background: rgba(91, 212, 156, 0.12); border: 1px solid var(--done); color: var(--done); padding: 14px; text-align: center; border-radius: 10px; margin: 8px 0; font-weight: 500; font-size: 14px; }
.session-list { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.si-group { padding: 11px 16px 7px; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-muted); background: var(--surface-2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; }
.si-group.current { color: var(--accent); }
.session-item { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); cursor: pointer; gap: 10px; }
.session-item:last-child { border-bottom: none; }
.session-item:active { background: var(--surface-2); }
.session-item.active { background: var(--accent-soft); }
.si-left .si-date { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
.si-left .si-title { font-size: 15px; font-weight: 500; }
.si-right { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 13px; }
.si-status { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-3); }
.si-status.done { background: var(--done); }
.si-status.partial { background: var(--warn); }
.overlay { position: fixed; inset: 0; background: rgba(11, 15, 20, 0.92); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; z-index: 100; overflow-y: auto; }
.overlay-content { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; max-width: 480px; width: 100%; }
.overlay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.overlay-header h2 { margin: 0; font-size: 18px; font-weight: 600; }
.overlay-header button { width: 36px; height: 36px; min-height: 36px; padding: 0; font-size: 18px; }
.hidden { display: none !important; }
.foot { text-align: center; padding: 18px 0 8px; color: var(--text-dim); font-size: 12px; }
.foot-actions { margin-top: 8px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: center; }
.foot-actions button { background: transparent; border: none; color: var(--text-muted); font-size: 14px; padding: 4px 8px; min-height: 44px; text-decoration: underline; cursor: pointer; }
.foot-actions button:hover { color: var(--text); }
.foot-sep { color: var(--text-dim); }
.metcon-protocol { font-size: 16px; color: var(--text); line-height: 1.5; margin-bottom: 14px; padding: 14px 16px; background: var(--surface-2); border-radius: 12px; border-left: 3px solid var(--accent); font-weight: 500; }
.metcon-protocol .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; font-weight: 600; }
.metcon-protocol ul.bullets { margin: 0; padding-left: 18px; }
.metcon-protocol ul.bullets li { margin: 4px 0; }
.metcon-timer-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 16px; text-align: center; margin-bottom: 14px; }
.metcon-timer-panel.active { border-color: var(--accent); }
.metcon-timer-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); font-weight: 600; margin-bottom: 6px; }
.metcon-timer { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; color: var(--text); margin-bottom: 6px; }
.emom-current { font-size: 17px; font-weight: 500; color: var(--accent); margin: 10px 0 4px; }
.emom-minute { font-size: 12px; color: var(--text-muted); }
.timer-controls { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
.timer-controls button { min-width: 96px; height: 44px; padding: 0 16px; font-size: 14px; }
.counter-grid { display: grid; gap: 10px; margin-bottom: 14px; }
.counter-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.counter-info { flex: 1; min-width: 0; }
.counter-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
.counter-value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.counter-target { font-size: 13px; color: var(--text-dim); font-weight: 400; }
.counter-buttons { display: flex; gap: 6px; flex-shrink: 0; }
.counter-buttons button { width: 48px; height: 48px; min-height: 48px; padding: 0; font-size: 20px; font-weight: 600; }
.counter-buttons .plus { background: var(--accent); color: #0B0F14; border-color: var(--accent); }
.counter-card.complete { background: rgba(91, 212, 156, 0.08); border-color: var(--done); }
.counter-card.complete .counter-value { color: var(--done); }
.metcon-finish-btn { width: 100%; height: 52px; font-size: 15px; font-weight: 600; }
.metcon-final { background: rgba(91, 212, 156, 0.12); border: 1px solid var(--done); color: var(--done); padding: 16px; text-align: center; border-radius: 10px; margin-bottom: 14px; font-weight: 500; }
.metcon-final .final-time { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0; color: var(--text); }
/* ===== Home view ===== */
.view-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-bottom: 14px; }
.view-toggle button { flex: 1; height: 44px; min-height: 44px; padding: 0 12px; background: transparent; border: none; border-radius: 999px; color: var(--text-muted); font-weight: 500; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.view-toggle button.active { background: var(--surface-3); color: var(--text); }
.home-section { margin-bottom: 20px; }
.home-section-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 4px 8px; font-weight: 600; }
.today-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.today-card-date { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.today-card-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
.today-card-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
.today-card-cta { width: 100%; height: 48px; background: var(--accent); color: #0B0F14; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; }
.today-card-cta:active { opacity: 0.8; }
.week-grid { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.week-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.week-row:last-child { border-bottom: none; }
.week-row-label { font-size: 14px; font-weight: 500; flex: 0 0 80px; }
.week-row-dots { display: flex; gap: 6px; flex: 1; }

// Reading must NEVER destroy what it could not parse. A half-written state (phone
// killed mid-save) is recoverable by hand; an overwritten one is gone forever.
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e) { return FRESH_STATE(); }
  if (!raw) return FRESH_STATE();
  try {
    const s = JSON.parse(raw);
    if (isStateShape(s)) return s;
    throw new Error('shape');
  } catch(e) {
    try { localStorage.setItem(STORE_KEY + '_corrupt', raw); } catch(_) {}
    try {
      const bak = JSON.parse(localStorage.getItem(STORE_KEY + '_bak'));
      if (isStateShape(bak)) { window.__recovered = true; return bak; }
    } catch(_) {}
    window.__wiped = true;
    return FRESH_STATE();
  }
}

// A save that fails silently is worse than one that crashes: the UI keeps
// showing ticks for sets that were never written to disk.
let __saveFailed = false;
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    __saveFailed = false;
  } catch(e) {
    if (!__saveFailed) {
      __saveFailed = true;
      alert('NOT SAVED — this device refused to store your log.\n\nTap Export in the footer now, before you close the app.');
    }
  }
}

// ============================================================
// EXPORT / IMPORT — local data backup
// ============================================================
function exportData() {
  try {
    const payload = {
      type: 'iron-protocol-backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      appVersion: APP_VERSION,
      storeKey: STORE_KEY,
      data: state,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const today = new Date().toISOString().slice(0, 10);
    const a = document.createElement('a');
    a.href = url;
    a.download = `iron-protocol-backup-${today}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
    state.lastExportAt = Date.now();
    saveState();
  } catch (e) {
    alert('Export failed: ' + (e && e.message ? e.message : e));
  }
}

function importDataFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const raw = String(e.target.result);
      const obj = JSON.parse(raw);
      // Accept versioned envelope OR a bare state object (for resilience).
      let newState = null;
      if (obj && obj.type === 'iron-protocol-backup' && obj.data) {
        newState = obj.data;
      } else if (obj && (obj.sessions || obj.notes || obj.metcons)) {
        newState = obj;
      }
      if (!newState) {
        alert('That file does not look like an Iron Protocol backup.');
        return;
      }
      const sessionCount = newState.sessions ? Object.keys(newState.sessions).length : 0;
      const exportedAt = (obj.exportedAt || '').slice(0, 19).replace('T', ' ');
      const meta = exportedAt ? `\nBackup from: ${exportedAt}` : '';
      const ok = confirm(
        `Import will REPLACE all current workout history on this device.\n` +
        `Sessions in backup: ${sessionCount}${meta}\n\nContinue?`
      );
      if (!ok) return;
      if (!isStateShape(newState) || !newState.sessions) {
        alert('That backup looks damaged — nothing was changed.');
        return;
      }
      try { localStorage.setItem(STORE_KEY + '_preimport', localStorage.getItem(STORE_KEY) || ''); } catch(e) {}
      localStorage.setItem(STORE_KEY, JSON.stringify(newState));
      location.reload();
    } catch (err) {
      alert('Import failed: ' + (err && err.message ? err.message : err));
    }
  };
  reader.readAsText(file);
}

function backupAge() {
  if (!state.lastExportAt) return { cls: 'stale', msg: 'never backed up' };
  const days = Math.floor((Date.now() - state.lastExportAt) / 86400000);
  if (days >= 14) return { cls: 'stale', msg: `backup ${days} days old` };
  return { cls: '', msg: days <= 0 ? 'backed up today' : `backup ${days}d old` };
}

function appendFooter(app) {
  const bu = backupAge();
  const foot = document.createElement('div');
  foot.className = 'foot';
  foot.innerHTML = `
    <div>${APP_VERSION} · local data on this device</div>
    <div class="foot-backup ${bu.cls}">${bu.cls === 'stale' ? '⚠ ' : ''}${bu.msg}</div>
    <div class="foot-actions">
      <button type="button" data-foot-act="export">Export</button>
      <span class="foot-sep">·</span>
      <button type="button" data-foot-act="import">Import</button>
    </div>
  `;
  app.appendChild(foot);
  foot.querySelector('[data-foot-act="export"]').addEventListener('click', exportData);
  foot.querySelector('[data-foot-act="import"]').addEventListener('click', () => {
    const inp = document.getElementById('importFileInput');
    if (inp) { inp.value = ''; inp.click(); }
  });
}

// Hidden file input for Import (created once, lives forever)
(function ensureImportInput() {
  if (document.getElementById('importFileInput')) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.id = 'importFileInput';
  inp.accept = '.json,application/json';
  inp.style.display = 'none';
  inp.addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importDataFromFile(f);
  });
  document.body.appendChild(inp);
})();

let state = loadState();

// Second copy on this device. Guarded on non-empty: a boot that came up blank
// must never overwrite the last good shadow.
try {
  if (state.sessions && Object.keys(state.sessions).length) {
    localStorage.setItem(STORE_KEY + '_bak', JSON.stringify(state));
  }
} catch(e) {}

if (window.__wiped) {
  setTimeout(() => alert(
    'Your saved log could not be read and no backup was found on this device.\n\n' +
    'The unreadable data was kept aside, not deleted. If you have an export file, ' +
    'use Import in the footer now rather than logging over the top of this.'), 400);
} else if (window.__recovered) {
  setTimeout(() => alert('Your saved log was damaged. Restored from the on-device backup — check your most recent session.'), 400);
}

if (!state.metcons) state.metcons = {};
if (!state.category) state.category = 'Gym';
if (!state.view) state.view = 'home';
if (!state.cardioLog) state.cardioLog = [];   // flexible cardio: [{date, type, min}]

// A running timer that survived an eviction would otherwise "complete" a session
// you never did. Stop the clock, keep every rep you actually logged.
Object.values(state.metcons || {}).forEach((ms) => {
  if (ms && ms.timerRunning && ms.timerStart && Date.now() - ms.timerStart > 2 * 3600e3) {
    ms.timerRunning = false;
    ms.timerStart = null;
  }
});

// One-time nav reset when the app updates to a new block. Resets which screen you
// land on — does NOT touch your logged history (state.sessions / metcons / cardioLog).
if (state.appVersion !== APP_VERSION) {
  state.appVersion = APP_VERSION;
  state.view = 'home';
  // Land on whatever block is CURRENT — never hardcode a block id here again.
  const curB = latestBlockId();
  const firstOfBlock = SESSIONS.find(s => s.block === curB);
  if (firstOfBlock) {
    state.category = firstOfBlock.category;
    const bidx = defaultSessionIdx(firstOfBlock.category);
    if (bidx >= 0) state.sessionIdx = bidx;
  }
  saveState();
}

(function initSession() {
  if (state.sessionIdx != null && SESSIONS[state.sessionIdx] && SESSIONS[state.sessionIdx].category === state.category) return;
  // Pick first session matching current category
  let idx = defaultSessionIdx(state.category);
  if (idx < 0) idx = 0;
  state.sessionIdx = idx;
})();

function getSessionState(sid) {
  if (!state.sessions[sid]) state.sessions[sid] = { sets: {}, openEx: 0, restEndTs: null };
  return state.sessions[sid];
}

function getMetconState(sid) {
  if (!state.metcons[sid]) state.metcons[sid] = { counters: {}, timerStart: null, timerElapsed: 0, timerRunning: false, completed: false, finalSec: null };
  return state.metcons[sid];
}

function categorySessions(cat) {
  return SESSIONS.map((s, i) => ({ s, i })).filter(({s}) => s.category === cat);
}

// ============================================================
// HELPERS
// ============================================================
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

// --- Month anchor for day-of-week-agnostic blocks (no fixed date, so derive from wkStart) ---
function blockMonthShort(s) {
  if (!s || !s.wkStart) return '';
  return new Date(s.wkStart + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
}
function blockMonthLong(s) {
  const iso = s && (s.wkStart || s.date);
  if (!iso) return 'Earlier';
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}
// What a session IS when it has no calendar date: "Sep 2026 · W1"
function sessionStamp(s) {
  if (!s) return '';
  if (s.date) return fmtDate(s.date);
  const m = blockMonthShort(s);
  if (!m) return s.duration || 'Anytime';
  return s.week ? m + ' · W' + s.week : m;
}

function fmtMS(totalSec) {
  totalSec = Math.max(0, Math.floor(totalSec));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function setKey(eIdx, sIdx) { return eIdx + '_' + sIdx; }

// ============================================================
// PLATE MATH — computed from the prescribed load. Never hand-written.
// ============================================================
// The rack at the La Paz outdoor gym, PER SIDE. If the gym inventory changes,
// change ONLY this table — every number in the app follows from it.
// Bar confirmed 45 lb Olympic (Dan, Aug 30 2026). Every per-side number below is
// (load - 45) / 2, so if the bar is ever swapped this constant changes everything.
const BAR_LB = 45;
// n = how many of that plate are available PER SIDE — one plate out of each pair.
// "two sets of thirty fives" = two pairs = 2 per side. Counts confirmed Aug 30 2026.
//
// The gym's 20 kg plates (44.09 lb) are deliberately absent. Confirmed decision:
// with 10 pairs of 45s on hand and no load in the block needing more than two per
// side, they are never required — and slipping one pair in would make a set the
// app calls 185 actually weigh 183.2, so the screen would be lying and the logged
// progression would drift. 20 kg plates are for the farmer's carry, not the bar.
const PLATES_PER_SIDE = [
  { lb: 45,  n: 10 },
  { lb: 35,  n: 2 },
  { lb: 25,  n: 2 },
  { lb: 10,  n: 1 },
  { lb: 5,   n: 2 },
  { lb: 2.5, n: 2 },
];

// Lifts loaded on a straight 45 lb bar with equal plates each side.
// Anything NOT on this list gets no plate math at all — a wrong number is worse
// than no number. Landmine, hack sled, leg press and dumbbells stay off it.
const BARBELL_LIFTS = [
  'Barbell Back Squat',
  'Barbell Bench Press',
  'Barbell Deadlift',
  'Barbell Overhead Press',
  'Romanian Deadlift',
];
function isBarbell(name) { return BARBELL_LIFTS.indexOf(name) >= 0; }

// Every legal way to make ONE side add up to target, given what he owns.
const _cfgCache = {};
function allConfigs(target) {
  if (!(target >= 0)) return [];
  const key = String(target);
  if (key in _cfgCache) return _cfgCache[key];
  const out = [];
  (function walk(i, rem, acc) {
    if (Math.abs(rem) < 1e-9) { out.push(acc.slice()); return; }
    if (i >= PLATES_PER_SIDE.length || rem < 1e-9) return;
    const p = PLATES_PER_SIDE[i];
    const maxC = Math.min(p.n, Math.floor(rem / p.lb + 1e-9));
    for (let c = maxC; c >= 0; c--) {
      for (let k = 0; k < c; k++) acc.push(p.lb);
      walk(i + 1, +(rem - c * p.lb).toFixed(3), acc);
      acc.length -= c;
    }
  })(0, target, []);
  _cfgCache[key] = out;
  return out;
}
function _count(arr) { return arr.reduce((m, v) => (m[v] = (m[v] || 0) + 1, m), {}); }
// How many plates you physically pick up going from load a to load b, one side.
function moveCost(a, b) {
  const ca = _count(a), cb = _count(b);
  let c = 0;
  Object.keys(Object.assign({}, ca, cb)).forEach(k => { c += Math.abs((cb[k] || 0) - (ca[k] || 0)); });
  return c;
}

// Canonical order: heaviest plate first, so the same load always reads the same way.
function _canon(a, b) {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const x = a[i] || 0, y = b[i] || 0;
    if (x !== y) return y - x;
  }
  return 0;
}
// The layouts that use the FEWEST plates for this load. Fewest plates is the
// objective that matters on the floor: fewer to carry, fewer to slide on, and a
// bar you can read at a glance. "25 + 10 + 5 + 5" is the algebra he is trying
// to get away from, even when it saves a plate change.
const _minCache = {};
function minConfigs(target) {
  const key = String(target);
  if (key in _minCache) return _minCache[key];
  const all = allConfigs(target);
  let out = [];
  if (all.length) {
    const min = Math.min.apply(null, all.map(c => c.length));
    out = all.filter(c => c.length === min).map(c => c.slice().sort((x, y) => y - x)).sort(_canon);
    // de-duplicate identical multisets
    out = out.filter((c, i) => i === 0 || _canon(c, out[i - 1]) !== 0);
  }
  _minCache[key] = out;
  return out;
}

// Several loads have more than one minimal layout — 185 is 45+25 or 35+35, 145
// is 45+5 or 25+25. Where there is a choice, take the one closest to what is
// already on the bar. Plate COUNT never changes to buy that; only the choice
// among equally small layouts does.
function solveChain(targets) {
  const opts = targets.map(t => (t == null || !(t >= 0)) ? null : minConfigs(t));
  const dp = opts.map(o => o && o.map(() => ({ cost: Infinity, prev: -1 })));
  for (let i = 0; i < opts.length; i++) {
    if (!opts[i]) continue;
    const fresh = (i === 0 || !opts[i - 1] || !opts[i - 1].length);
    opts[i].forEach((cfg, ci) => {
      if (fresh) { dp[i][ci] = { cost: cfg.length, prev: -1 }; return; }
      opts[i - 1].forEach((pcfg, pi) => {
        const p = dp[i - 1][pi];
        if (p.cost === Infinity) return;
        const cost = p.cost + moveCost(pcfg, cfg);
        if (cost < dp[i][ci].cost) dp[i][ci] = { cost: cost, prev: pi };
      });
    });
  }
  const out = targets.map(() => null);
  let i = opts.length - 1;
  while (i >= 0) {
    if (!opts[i] || !opts[i].length) { i--; continue; }
    let bi = 0;
    for (let k = 1; k < dp[i].length; k++) if (dp[i][k].cost < dp[i][bi].cost) bi = k;
    let j = i;
    while (j >= 0 && bi >= 0 && opts[j] && opts[j].length) {
      out[j] = opts[j][bi];
      bi = dp[j][bi].prev;
      j--;
      if (bi < 0) break;
    }
    i = j;
  }
  return out;
}

// Cached per exercise, keyed on the loads actually in play (so a logged actual
// re-solves the rest of the exercise instead of showing stale plates).
const _chainCache = {};
function chainFor(sesId, ex, eIdx, ssState) {
  if (!ex || !isBarbell(ex.name)) return null;
  const targets = ex.sets.map((s, sIdx) => {
    const w = effWeightNum(ssState.sets[setKey(eIdx, sIdx)], s);
    if (!isFinite(w) || w < BAR_LB) return null;
    return (w - BAR_LB) / 2;
  });
  const key = sesId + '|' + eIdx + '|' + targets.join(',');
  if (!(key in _chainCache)) _chainCache[key] = solveChain(targets);
  return _chainCache[key];
}

function plateText(arr) {
  if (!arr) return null;
  if (!arr.length) return 'empty bar';
  return arr.join(' + ');
}
// What changes on ONE side going from load a to load b.
function plateDelta(a, b) {
  if (!a || !b) return null;
  const ca = _count(a), cb = _count(b);
  const keys = Object.keys(Object.assign({}, ca, cb)).map(Number).sort((x, y) => y - x);
  const add = [], off = [];
  keys.forEach(k => {
    const d = (cb[k] || 0) - (ca[k] || 0);
    for (let i = 0; i < d; i++) add.push(k);
    for (let i = 0; i < -d; i++) off.push(k);
  });
  if (!add.length && !off.length) return 'bar stays as is';
  const parts = [];
  if (off.length) parts.push('strip ' + off.join(' + '));
  if (add.length) parts.push('add ' + add.join(' + '));
  return parts.join(' \u00b7 ');
}

// Numeric load actually on the bar for a set (logged actual wins over prescribed).
function effWeightNum(ss, s) {
  const raw = (ss && ss.actual && ss.actual.w != null && ss.actual.w !== '') ? ss.actual.w : (s ? s.w : null);
  if (typeof raw === 'number') return raw;
  const num = parseFloat(String(raw).replace(/[^0-9.]/g, ''));
  return isFinite(num) ? num : NaN;
}

// { text, delta, arr } for a set, or null when this lift gets no plate math.
function plateInfoFor(sesId, ex, eIdx, sIdx, ssState) {
  const chain = chainFor(sesId, ex, eIdx, ssState);
  if (!chain) return null;
  const cur = chain[sIdx];
  if (!cur) return null;
  const prev = sIdx > 0 ? chain[sIdx - 1] : null;
  return { text: plateText(cur), delta: prev ? plateDelta(prev, cur) : null, arr: cur };
}

// A set is "resolved" when it is done OR deliberately cut. Both stop the queue
// advancing to it and both count toward finishing the exercise.
function setResolved(ss) { return !!ss && (ss.status === 'completed' || ss.status === 'cut'); }

// "Last time" — same block, same slot, one week back, same exercise name.
function lastTimeFor(ses, exName) {
  if (!ses || !ses.week || ses.week < 2) return null;
  const prev = SESSIONS.find(s => s.block === ses.block && s.slot === ses.slot && s.week === ses.week - 1);
  if (!prev || !prev.exercises) return null;
  const pIdx = prev.exercises.findIndex(e => e.name === exName);
  if (pIdx < 0) return null;
  const ss = state.sessions[prev.id];
  if (!ss || !ss.sets) return null;
  let out = null;
  prev.exercises[pIdx].sets.forEach((set, sIdx) => {
    if (set.t !== 'work') return;
    const r = ss.sets[pIdx + '_' + sIdx];
    if (!r || r.status !== 'completed') return;
    const w = (r.actual && r.actual.w) || set.w;
    const rp = (r.actual && r.actual.r) || set.r;
    out = { w: w, r: rp };
  });
  if (!out) return null;
  const wTxt = typeof out.w === 'number' ? out.w + ' lb' : String(out.w);
  return wTxt + ' \u00d7 ' + out.r;
}

function isExComplete(sid, eIdx) {
  const ses = SESSIONS[state.sessionIdx];
  const ssState = getSessionState(sid);
  const sets = ses.exercises[eIdx].sets;
  return sets.every((_, sIdx) => setResolved(ssState.sets[setKey(eIdx, sIdx)]));
}

// ============================================================
// CATEGORY TOGGLE
// ============================================================
// The session a category should open on: current block, first slot not yet finished.
function defaultSessionIdx(cat) {
  const cur = latestBlockId();
  const inBlock = SESSIONS.map((s, i) => ({ s, i })).filter(({s}) => s.category === cat && s.block === cur);
  if (inBlock.length) {
    const open = inBlock.find(({s}) => getSessionCompletion(s.id) !== 'complete');
    return (open || inBlock[0]).i;
  }
  const fallback = SESSIONS.findIndex(s => s.category === cat && (!s.date || s.date >= todayStr()));
  return fallback >= 0 ? fallback : SESSIONS.findIndex(s => s.category === cat);
}

function switchCategory(cat) {
  if (state.category === cat) return;
  state.category = cat;
  const idx = defaultSessionIdx(cat);
  state.sessionIdx = idx >= 0 ? idx : 0;
  saveState();
  render();
}

// ============================================================
// HOME VIEW HELPERS
// ============================================================
function getSessionCompletion(sid) {
  const ses = SESSIONS.find(s => s.id === sid);
  if (!ses) return 'none';
  if (ses.type === 'kb-metcon') {
    const ms = state.metcons[sid];
    if (!ms) return 'none';
    if (ms.completed) return 'complete';
    const anyCounter = ms.counters && Object.values(ms.counters).some(v => v > 0);
    const anyTime = (ms.timerElapsed && ms.timerElapsed > 0) || ms.timerStart != null;
    if (anyCounter || anyTime) return 'partial';
    return 'none';
  } else {
    const ss = state.sessions[sid];
    if (!ss || !ss.sets) return 'none';
    let totalWork = 0, doneWork = 0;
    ses.exercises.forEach((ex, eIdx) => {
      ex.sets.forEach((set, sIdx) => {
        if (set.t !== 'work') return;
        totalWork++;
        const key = eIdx + '_' + sIdx;
        if (setResolved(ss.sets[key])) doneWork++;
      });
    });
    if (doneWork === 0) return 'none';
    if (doneWork >= totalWork) return 'complete';
    return 'partial';
  }
}

function getWeekStartMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function todayStr() { return ymd(new Date()); }

// ============================================================
// FLEXIBILITY — the plan gives the rails; you log what you actually did
// ============================================================
const CARDIO_TARGET = 3;            // cardio sessions per week (any type counts)
const CARDIO_TYPES = ['Walk', 'Ruck', 'Bike', 'Row', 'Other'];

// Which week of the current home block are we in? (date range, not a locked day)
// Whichever block has the most recent start date is "current" — so a new block
// (e.g. lapaz-aug26) automatically takes over from the prior one (home-jun26)
// without needing this file's logic hand-edited every time a block changes.
function latestBlockId() {
  const blocks = Array.from(new Set(SESSIONS.filter(s => s.block && s.wkStart).map(s => s.block)));
  let best = null, bestStart = null;
  blocks.forEach(b => {
    const starts = SESSIONS.filter(s => s.block === b && s.wkStart).map(s => s.wkStart);
    const minStart = starts.reduce((a, c) => c < a ? c : a, starts[0]);
    if (best === null || minStart > bestStart) { best = b; bestStart = minStart; }
  });
  return best;
}

function currentBlockWeek() {
  const t = todayStr();
  const activeBlock = latestBlockId();
  const blk = SESSIONS.filter(s => s.block === activeBlock && s.wkStart);
  if (!blk.length) return 1;
  for (const s of blk) { if (s.wkStart <= t && t <= s.wkEnd) return s.week; }
  const minStart = blk.reduce((a, s) => s.wkStart < a ? s.wkStart : a, blk[0].wkStart);
  if (t < minStart) return Math.min(...blk.map(s => s.week));
  return Math.max(...blk.map(s => s.week));   // after the block → hold on last week
}

// The 3 strength slots (A/B/C) for a given block week
function blockWeekSessions(week) {
  const activeBlock = latestBlockId();
  return SESSIONS.filter(s => s.block === activeBlock && s.week === week)
                 .sort((a, b) => (a.slot || '').localeCompare(b.slot || ''));
}

// Cardio entries logged within a [start,end] date range (inclusive)
function cardioInRange(start, end) {
  return (state.cardioLog || []).filter(c => c.date >= start && c.date <= end);
}

// What actually happened on a calendar day — drives the calendar dots (reality, not prescription)
function dayActivity(cellStr) {
  let completed = false, partial = false, cardio = false;
  const kinds = new Set();
  let tapSid = null;
  Object.entries(state.sessions || {}).forEach(([sid, ss]) => {
    if (!ss) return;
    const ses = SESSIONS.find(s => s.id === sid);
    if (!ses) return;
    const comp = getSessionCompletion(sid);
    // Use the day you actually trained (doneDate); fall back to the prescribed date for legacy completions.
    const doneDay = ss.doneDate || (comp === 'complete' && ses.date ? ses.date : null);
    const touchDay = ss.touchedDate || null;
    if (doneDay === cellStr) { completed = true; kinds.add(ses.category); tapSid = tapSid || sid; }
    else if (touchDay === cellStr && comp !== 'complete') { partial = true; kinds.add(ses.category); tapSid = tapSid || sid; }
  });
  Object.entries(state.metcons || {}).forEach(([sid, ms]) => {
    if (!ms || !ms.completed) return;
    const ses = SESSIONS.find(s => s.id === sid);
    if (!ses) return;
    const d = ms.doneDate || ses.date;
    if (d === cellStr) { completed = true; kinds.add('Conditioning'); tapSid = tapSid || sid; }
  });
  if (cardioInRange(cellStr, cellStr).length) { cardio = true; completed = true; kinds.add('Conditioning'); }
  return { completed, partial, cardio, kinds, tapSid };
}

function logCardio(type) {
  if (!state.cardioLog) state.cardioLog = [];
  state.cardioLog.push({ date: todayStr(), type, min: null });
  saveState(); render();
}
function undoCardioToday(type) {
  const t = todayStr();
  const i = (state.cardioLog || []).map((c, idx) => ({ c, idx })).filter(x => x.c.date === t && x.c.type === type).map(x => x.idx).pop();
  if (i != null) { state.cardioLog.splice(i, 1); saveState(); render(); }
}

function switchView(v) {
  if (state.view === v) return;
  state.view = v;
  saveState();
  render();
}

function goToSession(sid) {
  const idx = SESSIONS.findIndex(s => s.id === sid);
  if (idx < 0) return;
  state.view = 'sessions';
  state.sessionIdx = idx;
  state.category = SESSIONS[idx].category;
  saveState();
  render();
}
