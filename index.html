<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root {

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; min-height: 100vh; overscroll-behavior: none; }
body { padding: max(env(safe-area-inset-top), 12px) 12px max(env(safe-area-inset-bottom), 24px); }
button, input, textarea { font-family: inherit; font-size: 16px; }
input[type="number"], input[type="text"] { background: var(--surface-3); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 18px; text-align: center; width: 100%; font-variant-numeric: tabular-nums; }

.cat-toggle button.active { background: var(--surface-3); color: var(--text); }

.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 4px; }

.metcon-protocol .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; font-weight: 600; }
.metcon-protocol ul.bullets { margin: 0; padding-left: 18px; }
.metcon-protocol ul.bullets li { margin: 4px 0; }

/* ===== Home view ===== */

<body>
<div class="app" id="app"></div>
<div id="overlay" class="overlay hidden"></div>

<script>
// ============================================================
// PROGRAM DATA — May 20 – June 15, 2026 (Gym) + KB Home
// ============================================================
const R = (w, r) => ({t:'ramp', w, r, rir:'—'});
const W = (w, r, rir, perSide) => perSide ? {t:'work', w, r, rir, perSide:true} : {t:'work', w, r, rir};

// Canonical cue bullets — same lift = same cues across weeks.
const CUES = {
  deadlift: ['Bar over midfoot', 'Hinge at hips', 'Neutral spine', 'Drive floor away'],
  squat: ['Brace before unrack', 'Knees track toes', 'Parallel or below', 'Drive up'],

const STORE_KEY = 'workoutPwaState_v2';
const APP_VERSION = 'Iron Protocol v7.2';

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { sessionIdx: 0, sessions: {}, notes: {}, metcons: {}, category: 'Gym' };
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}

// ============================================================
// EXPORT / IMPORT — local data backup
// ============================================================
function exportData() {
  try {
    const payload = {
      type: 'iron-protocol-backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      appVersion: APP_VERSION,
      storeKey: STORE_KEY,
      data: state,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const today = new Date().toISOString().slice(0, 10);
    const a = document.createElement('a');
    a.href = url;
    a.download = `iron-protocol-backup-${today}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
  } catch (e) {
    alert('Export failed: ' + (e && e.message ? e.message : e));
  }
}

function importDataFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const raw = String(e.target.result);
      const obj = JSON.parse(raw);
      // Accept versioned envelope OR a bare state object (for resilience).
      let newState = null;
      if (obj && obj.type === 'iron-protocol-backup' && obj.data) {
        newState = obj.data;
      } else if (obj && (obj.sessions || obj.notes || obj.metcons)) {
        newState = obj;
      }
      if (!newState) {
        alert('That file does not look like an Iron Protocol backup.');
        return;
      }
      const sessionCount = newState.sessions ? Object.keys(newState.sessions).length : 0;
      const exportedAt = (obj.exportedAt || '').slice(0, 19).replace('T', ' ');
      const meta = exportedAt ? `\nBackup from: ${exportedAt}` : '';
      const ok = confirm(
        `Import will REPLACE all current workout history on this device.\n` +
        `Sessions in backup: ${sessionCount}${meta}\n\nContinue?`
      );
      if (!ok) return;
      localStorage.setItem(STORE_KEY, JSON.stringify(newState));
      location.reload();
    } catch (err) {
      alert('Import failed: ' + (err && err.message ? err.message : err));
    }
  };
  reader.readAsText(file);
}

function appendFooter(app) {
  const foot = document.createElement('div');
  foot.className = 'foot';
  foot.innerHTML = `
    <div>${APP_VERSION} · local data on this device</div>
    <div class="foot-actions">
      <button type="button" data-foot-act="export">Export</button>
      <span class="foot-sep">·</span>
      <button type="button" data-foot-act="import">Import</button>
    </div>
  `;
  app.appendChild(foot);
  foot.querySelector('[data-foot-act="export"]').addEventListener('click', exportData);
  foot.querySelector('[data-foot-act="import"]').addEventListener('click', () => {
    const inp = document.getElementById('importFileInput');
    if (inp) { inp.value = ''; inp.click(); }
  });
}

// Hidden file input for Import (created once, lives forever)
(function ensureImportInput() {
  if (document.getElementById('importFileInput')) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.id = 'importFileInput';
  inp.accept = '.json,application/json';
  inp.style.display = 'none';
  inp.addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importDataFromFile(f);
  });
  document.body.appendChild(inp);
})();

// land on — does NOT touch your logged history (state.sessions / metcons / cardioLog).
if (state.appVersion !== APP_VERSION) {
  state.appVersion = APP_VERSION;

  state.view = 'home';
  const w1a = SESSIONS.findIndex(s => s.id === 'kb-w1-a');
  if (w1a >= 0) state.sessionIdx = w1a;

}

(function initSession() {
  if (state.sessionIdx != null && SESSIONS[state.sessionIdx] && SESSIONS[state.sessionIdx].category === state.category) return;
  // Pick first session matching current category
  const today = new Date().toISOString().slice(0, 10);
  let idx = SESSIONS.findIndex(s => s.category === state.category && s.date && s.date >= today);
  if (idx < 0) idx = SESSIONS.findIndex(s => s.category === state.category);
  if (idx < 0) idx = 0;
  state.sessionIdx = idx;
})();

function getSessionState(sid) {
  if (!state.sessions[sid]) state.sessions[sid] = { sets: {}, openEx: 0, restEndTs: null };
  return state.sessions[sid];
}

function getMetconState(sid) {
  if (!state.metcons[sid]) state.metcons[sid] = { counters: {}, timerStart: null, timerElapsed: 0, timerRunning: false, completed: false, finalSec: null };
  return state.metcons[sid];
}

function categorySessions(cat) {
  return SESSIONS.map((s, i) => ({ s, i })).filter(({s}) => s.category === cat);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

function fmtMS(totalSec) {
  totalSec = Math.max(0, Math.floor(totalSec));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function setKey(eIdx, sIdx) { return eIdx + '_' + sIdx; }

function isExComplete(sid, eIdx) {
  const ses = SESSIONS[state.sessionIdx];
  const ssState = getSessionState(sid);
  const sets = ses.exercises[eIdx].sets;
  return sets.every((_, sIdx) => ssState.sets[setKey(eIdx, sIdx)]?.status === 'completed');
}

// ============================================================
function switchCategory(cat) {
  if (state.category === cat) return;
  state.category = cat;
  const first = SESSIONS.findIndex(s => s.category === cat && (!s.date || s.date >= new Date().toISOString().slice(0,10)));
  state.sessionIdx = first >= 0 ? first : SESSIONS.findIndex(s => s.category === cat);
  saveState();
  render();
}

// ============================================================
// HOME VIEW HELPERS
// ============================================================
function getSessionCompletion(sid) {
  const ses = SESSIONS.find(s => s.id === sid);
  if (!ses) return 'none';
  if (ses.type === 'kb-metcon') {
    const ms = state.metcons[sid];
    if (!ms) return 'none';
    if (ms.completed) return 'complete';
    const anyCounter = ms.counters && Object.values(ms.counters).some(v => v > 0);
    const anyTime = (ms.timerElapsed && ms.timerElapsed > 0) || ms.timerStart != null;
    if (anyCounter || anyTime) return 'partial';
    return 'none';
  } else {
    const ss = state.sessions[sid];
    if (!ss || !ss.sets) return 'none';
    let totalWork = 0, doneWork = 0;
    ses.exercises.forEach((ex, eIdx) => {
      ex.sets.forEach((set, sIdx) => {
        if (set.t !== 'work') return;
        totalWork++;
        const key = eIdx + '_' + sIdx;
        if (ss.sets[key] && ss.sets[key].status === 'completed') doneWork++;
      });
    });
    if (doneWork === 0) return 'none';
    if (doneWork >= totalWork) return 'complete';
    return 'partial';
  }
}

function getWeekStartMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function todayStr() { return ymd(new Date()); }

// ============================================================
// FLEXIBILITY — the plan gives the rails; you log what you actually did
// ============================================================
const CARDIO_TARGET = 3;            // cardio sessions per week (any type counts)
const CARDIO_TYPES = ['Walk', 'Ruck', 'Bike', 'Row', 'Other'];

// Which week of the current home block are we in? (date range, not a locked day)
// Whichever block has the most recent start date is "current" — so a new block
// (e.g. lapaz-aug26) automatically takes over from the prior one (home-jun26)
// without needing this file's logic hand-edited every time a block changes.
function latestBlockId() {
  const blocks = Array.from(new Set(SESSIONS.filter(s => s.block && s.wkStart).map(s => s.block)));
  let best = null, bestStart = null;
  blocks.forEach(b => {
    const starts = SESSIONS.filter(s => s.block === b && s.wkStart).map(s => s.wkStart);
    const minStart = starts.reduce((a, c) => c < a ? c : a, starts[0]);
    if (best === null || minStart > bestStart) { best = b; bestStart = minStart; }
  });
  return best;
}

function currentBlockWeek() {
  const t = todayStr();
  const activeBlock = latestBlockId();
  const blk = SESSIONS.filter(s => s.block === activeBlock && s.wkStart);
  if (!blk.length) return 1;
  for (const s of blk) { if (s.wkStart <= t && t <= s.wkEnd) return s.week; }
  const minStart = blk.reduce((a, s) => s.wkStart < a ? s.wkStart : a, blk[0].wkStart);
  if (t < minStart) return Math.min(...blk.map(s => s.week));
  return Math.max(...blk.map(s => s.week));   // after the block → hold on last week
}

// The 3 strength slots (A/B/C) for a given block week
function blockWeekSessions(week) {
  const activeBlock = latestBlockId();
  return SESSIONS.filter(s => s.block === activeBlock && s.week === week)
                 .sort((a, b) => (a.slot || '').localeCompare(b.slot || ''));
}

// Cardio entries logged within a [start,end] date range (inclusive)
function cardioInRange(start, end) {
  return (state.cardioLog || []).filter(c => c.date >= start && c.date <= end);
}

// What actually happened on a calendar day — drives the calendar dots (reality, not prescription)
function dayActivity(cellStr) {
  let completed = false, partial = false, cardio = false;
  const kinds = new Set();
  let tapSid = null;
  Object.entries(state.sessions || {}).forEach(([sid, ss]) => {
    if (!ss) return;
    const ses = SESSIONS.find(s => s.id === sid);
    if (!ses) return;
    const comp = getSessionCompletion(sid);
    // Use the day you actually trained (doneDate); fall back to the prescribed date for legacy completions.
    const doneDay = ss.doneDate || (comp === 'complete' && ses.date ? ses.date : null);
    const touchDay = ss.touchedDate || null;
    if (doneDay === cellStr) { completed = true; kinds.add(ses.category); tapSid = tapSid || sid; }
    else if (touchDay === cellStr && comp !== 'complete') { partial = true; kinds.add(ses.category); tapSid = tapSid || sid; }
  });
  Object.entries(state.metcons || {}).forEach(([sid, ms]) => {
    if (!ms || !ms.completed) return;
    const ses = SESSIONS.find(s => s.id === sid);
    if (!ses) return;
    const d = ms.doneDate || ses.date;
    if (d === cellStr) { completed = true; kinds.add('Conditioning'); tapSid = tapSid || sid; }
  });
  if (cardioInRange(cellStr, cellStr).length) { cardio = true; completed = true; kinds.add('Conditioning'); }
  return { completed, partial, cardio, kinds, tapSid };
}

function logCardio(type) {
  if (!state.cardioLog) state.cardioLog = [];
  state.cardioLog.push({ date: todayStr(), type, min: null });
  saveState(); render();
}
function undoCardioToday(type) {
  const t = todayStr();
  const i = (state.cardioLog || []).map((c, idx) => ({ c, idx })).filter(x => x.c.date === t && x.c.type === type).map(x => x.idx).pop();
  if (i != null) { state.cardioLog.splice(i, 1); saveState(); render(); }
}

function switchView(v) {
  if (state.view === v) return;
  state.view = v;
  saveState();
  render();
}

function goToSession(sid) {
  const idx = SESSIONS.findIndex(s => s.id === sid);
  if (idx < 0) return;
  state.view = 'sessions';
  state.sessionIdx = idx;
  state.category = SESSIONS[idx].category;
  saveState();
  render();
}

      <div class="today-card">

  }

  // === This week — the rails (3 strength slots) + a flexible cardio quota ===
  // Slots count as done whatever day you train them; cardio counts whatever type you log.
  const sec2 = document.createElement('div');
  sec2.className = 'home-section';
  const wLabel = `${fmtDate(wkStartB).replace(/^[A-Za-z]+,\s*/, '')} – ${fmtDate(wkEndB).replace(/^[A-Za-z]+,\s*/, '')}`;
  sec2.innerHTML = `<div class="home-section-label">This week · Week ${bw} · ${wLabel}</div>`;
  const wgrid = document.createElement('div');

  // Strength row — 3 slots A/B/C, tappable, done regardless of which day
  const strDone = slots.filter(s => getSessionCompletion(s.id) === 'complete').length;
  const slotChips = slots.map(s => {
    const st = getSessionCompletion(s.id);
    const cls = st === 'complete' ? 'done' : st === 'partial' ? 'partial' : '';
    return `<button class="wd-chip ${cls}" data-sid="${s.id}" title="${s.title}">${s.slot || '•'}</button>`;
  }).join('');
  const strRow = document.createElement('div');
  strRow.className = 'week-row';
  strRow.innerHTML = `
    <div class="week-row-label">Strength</div>
    <div class="week-row-dots">${slotChips}</div>

  `;
  wgrid.appendChild(strRow);
  strRow.querySelectorAll('.wd-chip').forEach(b => b.addEventListener('click', () => goToSession(b.dataset.sid)));

  // Cardio row — quota filled by anything logged this week
  const cardioThisWeek = cardioInRange(wkStartB, wkEndB);
  let cardioDots = '';
  for (let k = 0; k < CARDIO_TARGET; k++) cardioDots += `<div class="wd ${k < cardioThisWeek.length ? 'done' : ''}"></div>`;

  wgrid.appendChild(cardioRow);
  sec2.appendChild(wgrid);

  // Cardio quick-log — one tap stamps today (ruck walk, bike, row, whatever)
  const loggedToday = cardioInRange(today, today);
  const clog = document.createElement('div');
  clog.className = 'cardio-log';
  clog.innerHTML = `<div class="cardio-log-label">Log cardio today</div>
    <div class="cardio-btns">${CARDIO_TYPES.map(t => {
      const on = loggedToday.some(c => c.type === t);
      return `<button class="cardio-btn ${on ? 'on' : ''}" data-ct="${t}">${on ? '✓ ' : ''}${t}</button>`;
    }).join('')}</div>`;
  sec2.appendChild(clog);
  clog.querySelectorAll('.cardio-btn').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.ct;
    if (cardioInRange(today, today).some(c => c.type === t)) undoCardioToday(t); else logCardio(t);
  }));

  app.appendChild(sec2);

  // === 4-week calendar ===
  const sec3 = document.createElement('div');
  sec3.className = 'home-section';
  sec3.innerHTML = '<div class="home-section-label">Last 4 weeks</div>';
  const cal = document.createElement('div');
  cal.className = 'calendar-grid';

  const weekStart = getWeekStartMonday(new Date());
  const calStart = new Date(weekStart);
  calStart.setDate(calStart.getDate() - 21);

  const hdrRow = document.createElement('div');
  hdrRow.className = 'cal-row';
  hdrRow.innerHTML = '<div></div>' + ['M','T','W','T','F','S','S'].map(d => `<div class="cal-head">${d}</div>`).join('');
  cal.appendChild(hdrRow);

  for (let wk = 0; wk < 4; wk++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'cal-row';
    const weekDate = new Date(calStart); weekDate.setDate(weekDate.getDate() + wk*7);
    const wlab = document.createElement('div');
    wlab.className = 'cal-wlabel';
    wlab.textContent = `${weekDate.getMonth()+1}/${weekDate.getDate()}`;
    rowEl.appendChild(wlab);

    for (let d = 0; d < 7; d++) {
      const cellDate = new Date(weekDate); cellDate.setDate(cellDate.getDate() + d);
      const cellStr = ymd(cellDate);
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      // Calendar shows what you ACTUALLY did that day (reality), not what was prescribed.
      const act = dayActivity(cellStr);
      const isToday = cellStr === today;
      const isFuture = cellStr > today;
      if (!act.completed && !act.partial) cell.classList.add('empty');
      if (isToday) cell.classList.add('today');
      if (isFuture) cell.classList.add('future');

      // Category coloring from what was actually done
      const cats = act.kinds;
      if (cats.size > 1) cell.classList.add('has-multi');
      else if (cats.has('Gym')) cell.classList.add('has-gym');
      else if (cats.has('Conditioning')) cell.classList.add('has-cond');
      else if (cats.has('Home')) cell.classList.add('has-home');
      if (act.completed) cell.classList.add('completed');
      else if (act.partial) cell.classList.add('partial');

      cell.innerHTML = `<span class="day-num">${cellDate.getDate()}</span>`;
      if (act.tapSid) {
        cell.classList.add('tappable');
        cell.addEventListener('click', () => goToSession(act.tapSid));
      }
      rowEl.appendChild(cell);
    }
    cal.appendChild(rowEl);
  }
  sec3.appendChild(cal);

  const legend = document.createElement('div');
  legend.className = 'legend-row';
  legend.innerHTML = `
    <span class="leg"><span class="leg-swatch gym"></span>Strength</span>
    <span class="leg"><span class="leg-swatch cond"></span>Cardio</span>
    <span class="leg"><span class="leg-swatch home"></span>KB Home</span>
    <span class="leg" style="margin-left:auto">● done · ● partial</span>
  `;
  sec3.appendChild(legend);
  app.appendChild(sec3);

  // === All-time stats ===
  let totalCompleted = 0, totalTonnage = 0, totalCardioMin = 0, totalWorkSets = 0;
  SESSIONS.forEach(s => {
    const status = getSessionCompletion(s.id);
    if (status === 'complete') {
      totalCompleted++;
      if (s.type === 'gym' || s.type === 'kb-strength') {
        const ss = state.sessions[s.id];
        if (ss && ss.sets) {
          s.exercises.forEach((ex, eIdx) => {
            ex.sets.forEach((set, sIdx) => {
              if (set.t !== 'work') return;
              totalWorkSets++;
              const key = eIdx + '_' + sIdx;
              const result = ss.sets[key];
              if (result && result.status === 'completed') {
                const wRaw = (result.actual && result.actual.w) || set.w;
                const rRaw = (result.actual && result.actual.r) || set.r;
                const wNum = parseFloat(String(wRaw).replace(/[^0-9.]/g,'')) || 0;
                const rNum = parseInt(String(rRaw).replace(/[^0-9]/g,'')) || 0;
                if (wNum > 0 && rNum > 0) totalTonnage += wNum * rNum;
              }
            });
          });
        }
      }
      if (s.category === 'Conditioning') {
        // Prefer actual logged minutes (counter), fall back to prescribed duration
        const ms = state.metcons[s.id];
        const actualMins = ms && ms.counters && (ms.counters.mins || ms.counters.rounds || ms.counters.sets);
        if (actualMins && ms.counters.mins) {
          totalCardioMin += ms.counters.mins;
        } else {
          const m = (s.duration || '').match(/(\d+)/);
          if (m) totalCardioMin += parseInt(m[1]);
        }
      }
    }
  });

  // Reality-based: active days in the last 7, and total cardio sessions logged
  let activeDays7 = 0;
  for (let i = 0; i < 7; i++) {
    const dd = new Date(); dd.setDate(dd.getDate() - i);
    if (dayActivity(ymd(dd)).completed) activeDays7++;
  }
  let condDone = 0;
  Object.entries(state.metcons || {}).forEach(([sid, ms]) => {
    const s = SESSIONS.find(x => x.id === sid);
    if (s && s.category === 'Conditioning' && ms && ms.completed) condDone++;
  });
  const cardioSessions = (state.cardioLog || []).length + condDone;
  const sessionsAll = totalCompleted + (state.cardioLog || []).length;

  const sec4 = document.createElement('div');
  sec4.className = 'home-section';
  const tonnageDisplay = totalTonnage >= 1000 ? Math.round(totalTonnage/1000) + 'k' : Math.round(totalTonnage);
  sec4.innerHTML = `
    <div class="home-section-label">All-time</div>
    <div class="stats-grid">
      <div class="stat-tile">
        <div class="stat-tile-label">Sessions</div>
        <div class="stat-tile-value">${sessionsAll}</div>
        <div class="stat-tile-sub">completed</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Tonnage</div>
        <div class="stat-tile-value">${tonnageDisplay}</div>
        <div class="stat-tile-sub">lb · in-app log</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Cardio</div>
        <div class="stat-tile-value">${cardioSessions}</div>
        <div class="stat-tile-sub">sessions</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Active</div>
        <div class="stat-tile-value">${activeDays7}</div>
        <div class="stat-tile-sub">days · last 7</div>
      </div>
    </div>
  `;
  app.appendChild(sec4);

  appendFooter(app);
}

// ============================================================
// RENDER ROOT
// ============================================================
function render() {
  if (state.view === 'home') {
    renderHome();
    return;
  }
  const ses = SESSIONS[state.sessionIdx];
  if (!ses) { document.getElementById('app').innerHTML = '<p style="padding:20px;color:var(--text-muted)">No session selected.</p>'; return; }

  const app = document.getElementById('app');
  app.innerHTML = '';

  // View toggle (Home / Sessions)
  const vtoggle = document.createElement('div');
  vtoggle.className = 'view-toggle';
  vtoggle.innerHTML = `
    <button data-view="home">Home</button>
    <button class="active" data-view="sessions">Sessions</button>
  `;
  app.appendChild(vtoggle);
  vtoggle.querySelectorAll('button').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

  // Category toggle
  const catBar = document.createElement('div');
  catBar.className = 'cat-toggle';
  const gymCount = SESSIONS.filter(s => s.category === 'Gym').length;
  const homeCount = SESSIONS.filter(s => s.category === 'Home').length;
  const condCount = SESSIONS.filter(s => s.category === 'Conditioning').length;
  catBar.innerHTML = `
    <button class="${state.category === 'Gym' ? 'active' : ''}" data-cat="Gym">Gym <span class="badge">${gymCount}</span></button>
    <button class="${state.category === 'Conditioning' ? 'active' : ''}" data-cat="Conditioning">Cardio <span class="badge">${condCount}</span></button>
    <button class="${state.category === 'Home' ? 'active' : ''}" data-cat="Home">Home <span class="badge">${homeCount}</span></button>
  `;
  app.appendChild(catBar);
  catBar.querySelectorAll('button').forEach(b => b.addEventListener('click', () => switchCategory(b.dataset.cat)));

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'header';
  const dateLabel = ses.date ? fmtDate(ses.date) : 'Anytime';
  const liftLabel = ses.lift ? ` · Lift ${ses.lift} · W${ses.week}` : '';
  hdr.innerHTML = `
    <div class="session-pill" id="sessionPicker">
      <span class="date">${dateLabel}</span>
      ${liftLabel ? `<span>·</span><span>Lift ${ses.lift} · W${ses.week}</span>` : ''}
      <span class="arrow">▾</span>
    </div>
    <div class="nav-buttons">
      <button id="prevBtn" aria-label="previous session">‹</button>
      <button id="nextBtn" aria-label="next session">›</button>
    </div>
  `;
  app.appendChild(hdr);

  const title = document.createElement('div');
  title.className = 'session-title';
  title.textContent = ses.title;
  app.appendChild(title);

  // Render by type
  if (ses.type === 'kb-metcon') {
    renderMetcon(ses, app);
  } else {
    renderStrength(ses, app);
  }

  appendFooter(app);

  // Wire nav
  document.getElementById('prevBtn').addEventListener('click', () => navigateSession(-1));
  document.getElementById('nextBtn').addEventListener('click', () => navigateSession(1));
  document.getElementById('sessionPicker').addEventListener('click', openSessionPicker);
}

function navigateSession(dir) {
  const cat = state.category;
  const filtered = categorySessions(cat);
  const currentPos = filtered.findIndex(({i}) => i === state.sessionIdx);
  const newPos = currentPos + dir;
  if (newPos < 0 || newPos >= filtered.length) return;
  state.sessionIdx = filtered[newPos].i;
  saveState();
  render();
}

// ============================================================
// RENDER — STRENGTH (gym + kb-strength)
// ============================================================
function renderStrength(ses, app) {
  const ssState = getSessionState(ses.id);

  const totalWorkingSets = ses.exercises.reduce((a,e) => a + e.sets.filter(s => s.t === 'work').length, 0);
  const meta = document.createElement('div');
  meta.className = 'session-meta';
  meta.textContent = `${ses.exercises.length} exercises · ${totalWorkingSets} working sets`;
  app.appendChild(meta);

  const wu = document.createElement('div');
  wu.className = 'warmup-block';
  const wuList = ses.warmup || (ses.type === 'kb-strength' ? KB_WARMUP : WARMUP);
  wu.innerHTML = `<div class="label">Warm-up</div><ul>${wuList.map(w => `<li>${w}</li>`).join('')}</ul>`;
  app.appendChild(wu);

  ses.exercises.forEach((ex, eIdx) => {
    const isOpen = ssState.openEx === eIdx;
    const complete = isExComplete(ses.id, eIdx);

    const card = document.createElement('div');
    card.className = 'ex-card' + (isOpen ? ' open' : '');

    const cHdr = document.createElement('div');
    cHdr.className = 'ex-header';
    cHdr.innerHTML = `
      <div class="ex-header-left">
        <div class="ex-num">Exercise ${eIdx + 1} of ${ses.exercises.length}</div>
        <div class="ex-name">${ex.name}</div>
      </div>
      <div class="ex-progress">
        ${ex.sets.map((set, sIdx) => {
          const s = ssState.sets[setKey(eIdx, sIdx)];
          const isRamp = set.t === 'ramp';
          let cls = 'dot';
          if (isRamp) cls += ' ramp';
          if (s?.status === 'completed') cls += s.actual ? ' dev' : ' done';
          return `<span class="${cls}"></span>`;
        }).join('')}
      </div>
    `;
    cHdr.addEventListener('click', () => {
      ssState.openEx = isOpen ? -1 : eIdx;
      saveState(); render();
    });
    card.appendChild(cHdr);

    const body = document.createElement('div');
    body.className = 'ex-body';

    const metaRow = document.createElement('div');
    metaRow.className = 'ex-meta-row';
    const cueHtml = Array.isArray(ex.cue)
      ? `<ul class="bullets">${ex.cue.map(b => `<li>${b}</li>`).join('')}</ul>`
      : (ex.cue ? `<div>${ex.cue}</div>` : '');
    metaRow.innerHTML = `
      <span><span class="label">Tempo</span><span class="val">${ex.tempo}</span></span>
      <span><span class="label">Rest</span><span class="val">${ex.rest}</span></span>
      <div class="cue"><span class="label">Cue</span>${cueHtml}</div>
    `;
    body.appendChild(metaRow);

    const restActive = ssState.restEx === eIdx && ssState.restEndTs && Date.now() < ssState.restEndTs;
    if (restActive) {
      const remaining = Math.max(0, Math.ceil((ssState.restEndTs - Date.now()) / 1000));
      const nextSetIdx = ex.sets.findIndex((_, i) => !ssState.sets[setKey(eIdx, i)] || ssState.sets[setKey(eIdx, i)].status !== 'completed');
      const nextSet = nextSetIdx >= 0 ? ex.sets[nextSetIdx] : null;
      const restPanel = document.createElement('div');
      restPanel.className = 'rest-panel';
      restPanel.innerHTML = `
        <div class="rest-label">Rest</div>
        <div class="rest-time">${remaining}s</div>
        <div class="rest-next">${nextSet ? `Next: Set ${nextSetIdx + 1} · ${nextSet.w}${typeof nextSet.w === 'number' ? ' lb' : ''} × ${nextSet.r}${nextSet.perSide ? '/side' : ''}` : 'All sets complete'}</div>
        <div class="rest-actions">
          <button class="ghost" data-act="restSkip">Skip</button>
          <button class="ghost" data-act="restAdd">+30s</button>
        </div>
      `;
      body.appendChild(restPanel);
    }

    const table = document.createElement('div');
    table.className = 'set-table';

    const headRow = document.createElement('div');
    headRow.className = 'set-row head';
    headRow.innerHTML = `<span>Set</span><span>Weight</span><span>Reps</span><span>RIR</span><span></span>`;
    table.appendChild(headRow);

    const currentSetIdx = ex.sets.findIndex((_, i) => !ssState.sets[setKey(eIdx, i)] || ssState.sets[setKey(eIdx, i)].status !== 'completed');
    ex.sets.forEach((s, sIdx) => {
      const k = setKey(eIdx, sIdx);
      const ss = ssState.sets[k] || {};
      const isRamp = s.t === 'ramp';
      const row = document.createElement('div');

      const wDisplay = (val) => {
        if (val === 'BW') return 'BW';
        if (typeof val === 'string') return val;
        return val;
      };

      if (ss.mode === 'confirm') {
        row.className = 'confirm-panel';
        const repsStr = typeof s.r === 'string' ? s.r : `${s.r}${s.perSide ? '/side' : ''}`;
        const rirStr = (s.rir !== '—' && s.rir != null) ? `, RIR ${s.rir}` : '';
        const wTxt = s.w === 'BW' ? 'bodyweight' : (typeof s.w === 'number' ? `${s.w} lb` : s.w);
        const setLabel = isRamp ? `Ramp ${sIdx + 1}` : `Set ${sIdx + 1}`;
        const hSec = holdSec(ex, s);
        const primaryLabel = hSec ? `Start ${hSec}s` : 'Done';
        const primaryClass = hSec ? 'btn-start' : 'primary btn-done';
        const primaryAct = hSec ? 'workStart' : 'done';
        row.innerHTML = `
          <div class="confirm-head">${setLabel} · prescribed <b>${wTxt} × ${repsStr}${rirStr}</b></div>
          <div class="confirm-actions">
            <button class="${primaryClass}" data-act="${primaryAct}" data-set="${k}">${primaryLabel}</button>
            <div class="confirm-secondary">
              <button class="ghost" data-act="cancel" data-set="${k}">Cancel</button>
              <button data-act="dev" data-set="${k}">Log actuals</button>
            </div>
          </div>
        `;
      } else if (ss.mode === 'working') {
        row.className = 'work-panel';
        const hSec = holdSec(ex, s) || 0;
        const remaining = ss.workEndTs ? Math.max(0, Math.ceil((ss.workEndTs - Date.now()) / 1000)) : hSec;
        const setLabel = `Set ${sIdx + 1}`;
        row.innerHTML = `
          <div class="work-label">${ex.name} · ${setLabel}</div>
          <div class="work-time">${remaining}s</div>
          <div class="work-sub">Hold form. Breathe.</div>
          <div class="work-actions">
            <button class="ghost" data-act="workCancel" data-set="${k}">Cancel</button>
            <button data-act="workAdd" data-set="${k}">+10s</button>
            <button class="primary" data-act="workStop" data-set="${k}">Done early</button>
          </div>
        `;
      } else if (ss.mode === 'deviate') {
        row.className = 'confirm-panel';
        const repsStr = typeof s.r === 'string' ? s.r : `${s.r}${s.perSide ? '/side' : ''}`;
        const rirStr = (s.rir !== '—' && s.rir != null) ? `, RIR ${s.rir}` : '';
        const wTxt = s.w === 'BW' ? 'bodyweight' : (typeof s.w === 'number' ? `${s.w} lb` : s.w);
        const wDisabled = (s.w === 'BW' || typeof s.w === 'string') ? 'disabled' : '';
        const rirDisabled = (s.rir === '—' || s.rir == null) ? 'disabled' : '';
        const setLabel = isRamp ? `Ramp ${sIdx + 1}` : `Set ${sIdx + 1}`;
        row.innerHTML = `
          <div class="confirm-head">${setLabel} · prescribed <b>${wTxt} × ${repsStr}${rirStr}</b></div>
          <div class="edit-grid">
            <div><label>Weight</label><input type="text" placeholder="—" id="edW_${k}" ${wDisabled} inputmode="numeric"></div>
            <div><label>Reps</label><input type="text" placeholder="—" id="edR_${k}" inputmode="numeric"></div>
            <div><label>RIR</label><input type="text" placeholder="${rirDisabled ? 'n/a' : '—'}" id="edI_${k}" ${rirDisabled} inputmode="numeric"></div>
          </div>
          <div class="confirm-secondary">
            <button class="ghost" data-act="cancel" data-set="${k}">Cancel</button>
            <button class="primary" data-act="save" data-set="${k}">Save</button>
          </div>
        `;
      } else {
        row.className = 'set-row';
        if (isRamp) row.classList.add('ramp');
        if (ss.status === 'completed') row.classList.add('completed');
        if (ss.status === 'completed' && ss.actual) row.classList.add('deviated');
        if (ss.status !== 'completed' && sIdx === currentSetIdx) {
          row.classList.add('current');
          row.classList.add('tappable');
        }
        const dispW = ss.actual ? (ss.actual.w == null ? s.w : ss.actual.w) : s.w;
        const dispR = ss.actual ? (ss.actual.r == null ? s.r : ss.actual.r) : s.r;
        const dispI = ss.actual ? (ss.actual.rir == null ? s.rir : ss.actual.rir) : s.rir;
        const wText = wDisplay(dispW);
        const rText = typeof dispR === 'string' ? dispR : (dispR + (s.perSide ? '/sd' : ''));
        const tapMark = ss.status === 'completed' ? '✓' : (sIdx === currentSetIdx ? '›' : '');
        const setLabel = isRamp ? `R${sIdx + 1}` : `${sIdx + 1}`;
        row.innerHTML = `
          <span class="set-label">${setLabel}</span>
          <span class="set-cell weight-big">${wText}</span>
          <span class="set-cell">${rText}</span>
          <span class="set-cell">${dispI}</span>
          <span class="tap-cell">${tapMark}</span>
        `;
        if (ss.status !== 'completed' && sIdx === currentSetIdx) {
          row.addEventListener('click', () => {
            ssState.sets[k] = { ...ss, mode: 'confirm' };
            saveState(); render();
          });
        } else if (ss.status === 'completed') {
          row.addEventListener('click', () => {
            ssState.sets[k] = { ...ss, mode: 'deviate' };
            saveState(); render();
          });
        }
      }
      table.appendChild(row);
    });

    body.appendChild(table);

    if (complete) {
      const banner = document.createElement('div');
      banner.className = 'complete-banner';
      banner.textContent = '✓ Exercise complete';
      body.appendChild(banner);
    }

    const noteKey = ses.id + '_' + eIdx;
    const noteText = state.notes[noteKey] || '';
    const notes = document.createElement('textarea');
    notes.className = 'notes-field';
    notes.id = 'note_' + noteKey;
    notes.value = noteText;
    notes.placeholder = 'Tap to note — use your side-button voice dictation';
    notes.rows = 2;
    notes.addEventListener('input', (e) => {
      state.notes[noteKey] = e.target.value;
      saveState();
    });
    body.appendChild(notes);

    card.appendChild(body);
    app.appendChild(card);
  });

  // Flow finisher — display-only prompt (you log it separately in Garmin); styled like the warm-up block
  if (ses.flow) {
    const fl = document.createElement('div');
    fl.className = 'warmup-block';
    fl.innerHTML = `<div class="label">Flow finisher</div><ul><li>${ses.flow}</li></ul>`;
    app.appendChild(fl);
  }

  // Wire action buttons
  app.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleStrengthAction(btn.dataset.act, btn.dataset.set, btn);
    });
  });
}

function handleStrengthAction(act, setKeyStr) {
  const ses = SESSIONS[state.sessionIdx];
  const ssState = getSessionState(ses.id);

  if (act === 'restSkip') {
    ssState.restEndTs = null;
    ssState.restEx = null;
    saveState(); render();
    return;
  }
  if (act === 'restAdd') {
    if (ssState.restEndTs) {
      ssState.restEndTs += 30000;
      saveState(); render();
    }
    return;
  }

  if (!setKeyStr) return;
  const [eIdxStr, sIdxStr] = setKeyStr.split('_');
  const eIdx = parseInt(eIdxStr);
  const sIdx = parseInt(sIdxStr);
  const ex = ses.exercises[eIdx];
  const s = ex.sets[sIdx];
  if (!ssState.sets[setKeyStr]) ssState.sets[setKeyStr] = {};
  const ss = ssState.sets[setKeyStr];

  if (act === 'cancel') {
    ss.mode = null;
  } else if (act === 'dev') {
    ss.mode = 'deviate';
  } else if (act === 'done') {
    ss.mode = null;
    ss.status = 'completed';
    ss.actual = null;
    startRestForEx(eIdx, ex, s);
  } else if (act === 'workStart') {
    const hSec = holdSec(ex, s);
    if (hSec) {
      ss.mode = 'working';
      ss.workEndTs = Date.now() + hSec * 1000;
      beep(880, 150);
    }
  } else if (act === 'workAdd') {
    if (ss.workEndTs) ss.workEndTs += 10000;
  } else if (act === 'workCancel') {
    ss.mode = null;
    ss.workEndTs = null;
  } else if (act === 'workStop') {
    ss.mode = null;
    ss.workEndTs = null;
    ss.status = 'completed';
    ss.actual = null;
    beep(660, 200);
    startRestForEx(eIdx, ex, s);
  } else if (act === 'save') {
    const wEl = document.getElementById('edW_' + setKeyStr);
    const rEl = document.getElementById('edR_' + setKeyStr);
    const iEl = document.getElementById('edI_' + setKeyStr);
    const wVal = wEl && !wEl.disabled ? wEl.value.trim() : '';
    const rVal = rEl ? rEl.value.trim() : '';
    const iVal = iEl && !iEl.disabled ? iEl.value.trim() : '';
    if (!wVal && !rVal && !iVal) {
      ss.mode = null;
    } else {
      ss.actual = {
        w: wVal || null,
        r: rVal || null,
        rir: iVal || null,
      };
      ss.status = 'completed';
      ss.mode = null;
      startRestForEx(eIdx, ex, s);
    }
  }
  // Stamp the day you actually trained, so the calendar shows reality even if you
  // shifted the session off its prescribed day. doneDate locks once the session is complete.
  if (['done', 'workStop', 'save'].includes(act)) {
    ssState.touchedDate = todayStr();
    if (getSessionCompletion(ses.id) === 'complete' && !ssState.doneDate) ssState.doneDate = todayStr();
  }
  saveState(); render();
}

// Returns work-timer seconds if this set is a timed hold (e.g. Plank 45s), else null.
function holdSec(ex, setData) {
  if (!ex || ex.tempo !== 'hold' || !setData) return null;
  if (typeof setData.r !== 'string') return null;
  const m = setData.r.match(/^\s*(\d+)\s*s\s*$/i);
  return m ? parseInt(m[1], 10) : null;
}

// Short beep on timer events (work-start, work-end). Reuses Web Audio.
function beep(freq, ms) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq || 880;
    g.gain.value = 0.12;
    o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, ms || 180);
  } catch(e) {}
}

function startRestForEx(eIdx, ex, setData) {
  const ses = SESSIONS[state.sessionIdx];
  const ssState = getSessionState(ses.id);
  const rest = ex.rest || '';
  let seconds = 0;
  const m = rest.match(/(\d+)\s*(min|sec)/i);
  if (m) {
    seconds = parseInt(m[1]) * (m[2].toLowerCase().startsWith('m') ? 60 : 1);
  }
  if (setData && setData.t === 'ramp') seconds = Math.min(seconds, 60);
  if (seconds > 0) {
    ssState.restEx = eIdx;
    ssState.restEndTs = Date.now() + seconds * 1000;
  }
}

// ============================================================
// RENDER — METCON
// ============================================================
function renderMetcon(ses, app) {
  const ms = getMetconState(ses.id);

  const meta = document.createElement('div');
  meta.className = 'session-meta';
  meta.textContent = `${ses.duration} · ${ses.metconKind === 'forTime' ? 'For time' : ses.metconKind === 'emom' ? 'EMOM' : 'Self-paced'}`;
  app.appendChild(meta);

  // Protocol — array of bullets or legacy string
  if (ses.protocol) {
    const proto = document.createElement('div');
    proto.className = 'metcon-protocol';
    const body = Array.isArray(ses.protocol)
      ? `<ul class="bullets">${ses.protocol.map(b => `<li>${b}</li>`).join('')}</ul>`
      : ses.protocol;
    proto.innerHTML = `<div class="label">Protocol</div>${body}`;
    app.appendChild(proto);
  }

  // Alternate (if sled occupied, rower busy, etc.)
  if (ses.alt) {
    const alt = document.createElement('div');
    alt.className = 'alt-block';
    alt.innerHTML = `<span class="label">Alternate</span>${ses.alt}`;
    app.appendChild(alt);
  }

  // Cardio swap chips — tap to jump to alternate session
  if (ses.alternates && ses.alternates.length) {
    const swapDiv = document.createElement('div');
    swapDiv.className = 'alt-block cardio-swap';
    const chips = ses.alternates.map(alt =>
      `<button class="swap-chip" data-swap="${alt.id}">${alt.label}</button>`
    ).join('');
    swapDiv.innerHTML = `<span class="label">Swap to:</span><div class="swap-chips">${chips}</div>`;
    app.appendChild(swapDiv);
    swapDiv.querySelectorAll('[data-swap]').forEach(btn => {
      btn.addEventListener('click', () => goToSession(btn.dataset.swap));
    });
  }

  // Timer panel
  const timerPanel = document.createElement('div');
  timerPanel.className = 'metcon-timer-panel' + (ms.timerRunning ? ' active' : '');
  const elapsed = ms.timerRunning && ms.timerStart ? Math.floor((Date.now() - ms.timerStart + ms.timerElapsed) / 1000) : Math.floor(ms.timerElapsed / 1000);

  if (ses.timer.mode === 'emom') {
    const total = ses.timer.durationSec;
    const remaining = total - elapsed;
    const currentMin = Math.floor(elapsed / 60) + 1;
    const minIdx = (currentMin - 1) % ses.rounds.length;
    const currentWork = ses.rounds[minIdx] ? ses.rounds[minIdx].label : '';
    const display = ms.completed ? fmtMS(ms.finalSec) : (ms.timerRunning || ms.timerElapsed > 0 ? fmtMS(remaining) : fmtMS(total));
    timerPanel.innerHTML = `
      <div class="metcon-timer-label">${ms.timerRunning ? 'Time remaining' : ms.completed ? 'Finished' : 'EMOM 20'}</div>
      <div class="metcon-timer">${display}</div>
      ${ms.timerRunning && remaining > 0 ? `
        <div class="emom-current">${currentWork}</div>
        <div class="emom-minute">Minute ${currentMin} of ${Math.floor(total/60)}</div>
      ` : ''}
      ${!ms.completed ? `<div class="timer-controls">
        ${ms.timerRunning ? '<button class="ghost" data-mc="pause">Pause</button>' : `<button class="primary" data-mc="start">${ms.timerElapsed > 0 ? 'Resume' : 'Start'}</button>`}
        ${ms.timerElapsed > 0 ? '<button class="ghost" data-mc="reset">Reset</button>' : ''}
      </div>` : ''}
    `;
  } else {
    // Stopwatch
    const display = ms.completed ? fmtMS(ms.finalSec) : fmtMS(elapsed);
    timerPanel.innerHTML = `
      <div class="metcon-timer-label">${ms.timerRunning ? 'Elapsed' : ms.completed ? 'Final time' : 'Stopwatch'}</div>
      <div class="metcon-timer">${display}</div>
      ${!ms.completed ? `<div class="timer-controls">
        ${ms.timerRunning ? '<button class="ghost" data-mc="pause">Pause</button>' : `<button class="primary" data-mc="start">${ms.timerElapsed > 0 ? 'Resume' : 'Start'}</button>`}
        ${ms.timerElapsed > 0 ? '<button class="ghost" data-mc="reset">Reset</button>' : ''}
      </div>` : ''}
    `;
  }
  app.appendChild(timerPanel);

  // Counters (if present)
  if (ses.counters && ses.counters.length) {
    const grid = document.createElement('div');
    grid.className = 'counter-grid';
    ses.counters.forEach(c => {
      const v = ms.counters[c.id] || 0;
      const done = v >= c.target;
      const card = document.createElement('div');
      card.className = 'counter-card' + (done ? ' complete' : '');
      card.innerHTML = `
        <div class="counter-info">
          <div class="counter-label">${c.label}</div>
          <div class="counter-value">${v}<span class="counter-target"> / ${c.target}</span></div>
        </div>
        <div class="counter-buttons">
          <button data-cnt="${c.id}" data-delta="-${c.step}">−</button>
          <button class="plus" data-cnt="${c.id}" data-delta="${c.step}">+</button>
        </div>
      `;
      grid.appendChild(card);
    });
    app.appendChild(grid);
  }

  // Completion / Finish button
  if (ms.completed) {
    const final = document.createElement('div');
    final.className = 'metcon-final';
    final.innerHTML = `<div>Workout complete</div><div class="final-time">${fmtMS(ms.finalSec)}</div><div>Logged. Tap Reset to start over.</div>`;
    app.appendChild(final);
    const resetBtn = document.createElement('button');
    resetBtn.className = 'metcon-finish-btn ghost';
    resetBtn.textContent = 'Reset workout';
    resetBtn.addEventListener('click', () => resetMetcon(ses.id));
    app.appendChild(resetBtn);
  } else {
    const finishBtn = document.createElement('button');
    finishBtn.className = 'metcon-finish-btn primary';
    finishBtn.textContent = 'Finish & log time';
    finishBtn.addEventListener('click', () => finishMetcon(ses.id));
    app.appendChild(finishBtn);
  }

  // Notes
  const noteKey = ses.id + '_metcon';
  const noteText = state.notes[noteKey] || '';
  const notes = document.createElement('textarea');
  notes.className = 'notes-field';
  notes.style.marginTop = '12px';
  notes.value = noteText;
  notes.placeholder = 'Tap to note — use your side-button voice dictation';
  notes.rows = 2;
  notes.addEventListener('input', (e) => {
    state.notes[noteKey] = e.target.value;
    saveState();
  });
  app.appendChild(notes);

  // Wire metcon actions
  app.querySelectorAll('[data-mc]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    handleMetconTimer(ses.id, b.dataset.mc);
  }));
  app.querySelectorAll('[data-cnt]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    handleCounter(ses.id, b.dataset.cnt, parseInt(b.dataset.delta));
  }));
}

function handleMetconTimer(sid, action) {
  const ms = getMetconState(sid);
  const ses = SESSIONS.find(s => s.id === sid);
  if (action === 'start') {
    ms.timerStart = Date.now();
    ms.timerRunning = true;
    // For EMOM, beep when starting first minute
    if (ses.timer.mode === 'emom') speakMinute(ses, 1);
  } else if (action === 'pause') {
    if (ms.timerStart) {
      ms.timerElapsed += Date.now() - ms.timerStart;
      ms.timerStart = null;
    }
    ms.timerRunning = false;
  } else if (action === 'reset') {
    ms.timerStart = null;
    ms.timerElapsed = 0;
    ms.timerRunning = false;
    ms.completed = false;
    ms.finalSec = null;
  }
  saveState(); render();
}

function handleCounter(sid, cntId, delta) {
  const ms = getMetconState(sid);
  ms.counters[cntId] = Math.max(0, (ms.counters[cntId] || 0) + delta);
  saveState(); render();
}

function finishMetcon(sid) {
  const ms = getMetconState(sid);
  let elapsed = ms.timerElapsed;
  if (ms.timerRunning && ms.timerStart) {
    elapsed += Date.now() - ms.timerStart;
  }
  ms.finalSec = Math.floor(elapsed / 1000);
  ms.completed = true;
  ms.timerRunning = false;
  ms.timerStart = null;
  saveState(); render();
}

function resetMetcon(sid) {
  state.metcons[sid] = { counters: {}, timerStart: null, timerElapsed: 0, timerRunning: false, completed: false, finalSec: null };
  saveState(); render();
}

// EMOM voice/beep cue
let lastEmomMin = 0;
function speakMinute(ses, minute) {
  try {
    const idx = (minute - 1) % ses.rounds.length;
    const txt = `Minute ${minute}. ${ses.rounds[idx].label}.`;
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(txt);
      u.rate = 1.0;
      u.volume = 1.0;
      window.speechSynthesis.speak(u);
    }
    // Simple beep
    if (window.AudioContext || window.webkitAudioContext) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.value = 0.1;
      o.start();
      setTimeout(() => { o.stop(); ctx.close(); }, 200);
    }
  } catch(e) {}
}

// ============================================================
// SESSION PICKER
// ============================================================
function openSessionPicker() {
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = '';

  const content = document.createElement('div');
  content.className = 'overlay-content';

  const oHdr = document.createElement('div');
  oHdr.className = 'overlay-header';
  oHdr.innerHTML = `<h2>Pick ${state.category} session</h2><button id="closeOverlay" aria-label="close">×</button>`;
  content.appendChild(oHdr);

  const list = document.createElement('div');
  list.className = 'session-list';
  SESSIONS.forEach((s, i) => {
    if (s.category !== state.category) return;
    let statusCls = '';
    let progress = '';

    if (s.type === 'kb-metcon') {
      const ms = state.metcons[s.id];
      if (ms && ms.completed) { statusCls = 'done'; progress = fmtMS(ms.finalSec); }
      else if (ms && (ms.timerElapsed > 0 || Object.keys(ms.counters || {}).length > 0)) { statusCls = 'partial'; progress = 'in progress'; }
    } else {
      const ssState = state.sessions[s.id] || { sets: {} };
      const workSets = s.exercises.reduce((a, e) => a + e.sets.filter(x => x.t === 'work').length, 0);
      const doneWork = Object.entries(ssState.sets).filter(([k, x]) => {
        if (x.status !== 'completed') return false;
        const [ei, si] = k.split('_').map(Number);
        return s.exercises[ei] && s.exercises[ei].sets[si] && s.exercises[ei].sets[si].t === 'work';
      }).length;
      if (doneWork === workSets) statusCls = 'done';
      else if (doneWork > 0) statusCls = 'partial';
      progress = `${doneWork}/${workSets}`;
    }

    const item = document.createElement('div');
    item.className = 'session-item' + (i === state.sessionIdx ? ' active' : '');
    item.innerHTML = `
      <div class="si-left">
        <div class="si-date">${s.date ? fmtDate(s.date) : (s.duration || 'Anytime')}</div>
        <div class="si-title">${s.title}</div>
      </div>
      <div class="si-right">
        <span>${progress}</span>
        <span class="si-status ${statusCls}"></span>
      </div>
    `;
    item.addEventListener('click', () => {
      state.sessionIdx = i;
      saveState();
      closeOverlay();
      render();
    });
    list.appendChild(item);
  });
  content.appendChild(list);

  overlay.appendChild(content);
  document.getElementById('closeOverlay').addEventListener('click', closeOverlay);
}

function closeOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

// ============================================================
// TICK LOOP — strength rest + metcon timer
// ============================================================
setInterval(() => {
  const ses = SESSIONS[state.sessionIdx];
  if (!ses) return;

  if (ses.type === 'kb-metcon') {
    const ms = state.metcons[ses.id];
    if (!ms || !ms.timerRunning) return;
    const elapsed = Math.floor((Date.now() - ms.timerStart + ms.timerElapsed) / 1000);

    if (ses.timer.mode === 'emom') {
      const currentMin = Math.floor(elapsed / 60) + 1;
      const total = ses.timer.durationSec;
      // Beep on minute boundary
      if (currentMin !== lastEmomMin && currentMin > 1 && elapsed < total) {
        lastEmomMin = currentMin;
        speakMinute(ses, currentMin);
      }
      // Auto-finish at end
      if (elapsed >= total) {
        ms.timerElapsed = total * 1000;
        ms.timerStart = null;
        ms.timerRunning = false;
        ms.completed = true;
        ms.finalSec = total;
        saveState(); render();
        return;
      }
    }
    // Update timer display in place
    const t = document.querySelector('.metcon-timer');
    if (t) {
      if (ses.timer.mode === 'emom') {
        const remaining = ses.timer.durationSec - elapsed;
        t.textContent = fmtMS(remaining);
        const minEl = document.querySelector('.emom-minute');
        const cwEl = document.querySelector('.emom-current');
        const min = Math.floor(elapsed / 60) + 1;
        const idx = (min - 1) % ses.rounds.length;
        if (minEl) minEl.textContent = `Minute ${min} of ${Math.floor(ses.timer.durationSec/60)}`;
        if (cwEl) cwEl.textContent = ses.rounds[idx] ? ses.rounds[idx].label : '';
      } else {
        t.textContent = fmtMS(elapsed);
      }
    }
    return;
  }

  // Strength rest + work timers
  const ssState = state.sessions[ses.id];
  if (!ssState) return;

  // Work timer (timed-hold exercises like Plank)
  let workingKey = null, workingEntry = null;
  for (const k in ssState.sets) {
    if (ssState.sets[k].mode === 'working' && ssState.sets[k].workEndTs) {
      workingKey = k; workingEntry = ssState.sets[k]; break;
    }
  }
  if (workingEntry) {
    if (Date.now() >= workingEntry.workEndTs) {
      // Auto-complete the set, kick off rest
      const [eIdxStr, sIdxStr] = workingKey.split('_');
      const eIdx = parseInt(eIdxStr), sIdx = parseInt(sIdxStr);
      const ex = ses.exercises[eIdx];
      const s = ex.sets[sIdx];
      workingEntry.mode = null;
      workingEntry.workEndTs = null;
      workingEntry.status = 'completed';
      workingEntry.actual = null;
      beep(660, 250);
      startRestForEx(eIdx, ex, s);
      saveState();
      render();
      return;
    } else {
      const workTime = document.querySelector('.work-time');
      if (workTime) {
        const remaining = Math.max(0, Math.ceil((workingEntry.workEndTs - Date.now()) / 1000));
        workTime.textContent = remaining + 's';
      }
    }
  }

  if (!ssState.restEndTs) return;
  if (Date.now() >= ssState.restEndTs) {
    ssState.restEndTs = null;
    ssState.restEx = null;
    saveState();
    render();
  } else {
    const restTime = document.querySelector('.rest-time');
    if (restTime) {
      const remaining = Math.max(0, Math.ceil((ssState.restEndTs - Date.now()) / 1000));
      restTime.textContent = remaining + 's';
    }
  }
}, 1000);

render();

// Register service worker + auto-reload when a new version takes over
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed:', e));
  });
  let didReloadForSwUpdate = false;
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'SW_UPDATED' && !didReloadForSwUpdate) {
      didReloadForSwUpdate = true;
      location.reload();
    }
  });
}
</script>
</body>
